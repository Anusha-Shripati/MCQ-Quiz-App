notify_success:
  stage: notify
  script:
    - |
      curl -X POST -H "Content-Type: application/json" \
      -d "{\"text\":\"✅ Pipeline Success! Branch - $CI_COMMIT_REF_NAME, Commit - $CI_COMMIT_SHORT_SHA\"}" \
      $GOOGLE_CHAT_WEBHOOK
  when: on_success

notify_failure:
  stage: notify
  script:
    - |
      curl -X POST -H "Content-Type: application/json" \
      -d "{\"text\":\"❌ Pipeline Failed! Branch - $CI_COMMIT_REF_NAME, Commit - $CI_COMMIT_SHORT_SHA. Check logs at $CI_PROJECT_URL/-/jobs\"}" \
      $GOOGLE_CHAT_WEBHOOK
  when: on_failure