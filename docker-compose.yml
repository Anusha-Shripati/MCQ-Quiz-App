version: "3.8"

services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: postgres-container
    environment:
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: root
      POSTGRESQL_DATABASE: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/bitnami/postgresql
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcq-quiz-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:root@postgres-container:5432/app_db
      REDIS_URL: redis://redis-container:6379
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcq-quiz-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - "9000:9000"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always
    volumes:
      - ./frontend/logs:/app/logs

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge 