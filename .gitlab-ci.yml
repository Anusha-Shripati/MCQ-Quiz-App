image: node:20.11.1

stages:
  - install
  - build
  # - deploy
  - notify

variables:
  GOOGLE_CHAT_WEBHOOK: "https://chat.googleapis.com/v1/spaces/AAQA-lR4kHg/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=A9lMqtlzYkoNaKU7IV5014cAN-hdv5BESiVSxGc_iEk"

# Global cache configuration
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
  policy: pull

.node_modules_cache: &node_modules_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node-modules
    paths:
      - backend/node_modules/
      - frontend/node_modules/
      - node_modules/
    policy: pull-push

install_dependencies:
  stage: install
  <<: *node_modules_cache
  script:
    - npm ci --cache .npm --prefer-offline &
    - cd backend && npm ci --cache .npm --prefer-offline &
    - cd ../frontend && npm ci --cache .npm --prefer-offline &
    - wait
    - echo "All installations completed successfully"

build:
  stage: build
  <<: *node_modules_cache
  needs:
    - install_dependencies
  script:
    - npm run prisma:generate
    - npm run build
  artifacts:
    name: "$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - backend/dist/
      - frontend/.next/
    exclude:
      - backend/node_modules/**/*
      - frontend/node_modules/**/*
      - node_modules/**/*

