cache:
  paths:
    - backend/node_modules/
    - frontend/node_modules/
    - node_modules/

install_dependencies:
  stage: install
  script:
    - npm install
    - cd backend && npm install
    - cd ../frontend && npm install
    - cd ..
  artifacts:
    paths:
      - backend/node_modules/
      - frontend/node_modules/
      - node_modules/

build:
  stage: build
  script:
    - npm run prisma:generate
    - npm run build
  artifacts:
    paths:
      - backend/dist
      - frontend/.next
      - backend/node_modules
      - frontend/node_modules

